[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-programming-talk"
version = "0.1.0"
description = "Helper functions for the 'Elements of Quantum Programming' talk notebooks"
readme = "README.md"
authors = [{ name = "Abraham Asfaw" }]
requires-python = ">=3.11"
# MIT, except qiskit_qsphere.py, which is adapted from Qiskit and stays Apache-2.0.
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "helpers/LICENSE-QISKIT.txt"]
dependencies = [
    "cirq-core>=1.7,<2",
    "numpy",
    "matplotlib",
    "ipython",
]

[project.urls]
Repository = "https://github.com/aasfaw-quera/quantum-programming-talk"

[tool.setuptools]
# The modules live in helpers/ but install as top-level modules, so the notebooks can do
# `from quantum_plots import ...`. scripts/ regenerates images/ and is not installed.
package-dir = { "" = "helpers" }
py-modules = ["marked_number_boxes", "quantum_plots", "qiskit_qsphere"]
